<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyDot - 究極メッセンジャー</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --main-color: #007AFF; --bg-color: #f5f5f7; --border-color: #e5e5ea; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        /* 全体コンテナ */
        #app-container { 
            width: 100%; 
            max-width: 1200px; 
            height: 100vh; 
            background: white; 
            display: flex; 
            flex-direction: row; 
            position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
            overflow: hidden; 
        }
        
        /* 左側：サイドバー */
        .sidebar {
            width: 380px;
            min-width: 320px;
            height: 100%;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: #fff;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        /* 右側：メインコンテンツ */
        .main-content {
            flex: 1;
            height: 100%;
            background: #eceff1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダー */
        .header { background: white; border-bottom: 1px solid var(--border-color); padding: 15px; text-align: center; position: relative; }
        .logo { font-size: 24px; font-weight: 800; color: var(--main-color); letter-spacing: 1px; }
        .my-id-display { font-size: 11px; color: #888; margin-top: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* スクロールエリア */
        .sidebar-content { flex: 1; overflow-y: auto; background: #fff; }
        .page { display: none; height: 100%; width: 100%; }
        .page.active { display: block; }

        /* ナビゲーションバー */
        .nav-bar { height: 65px; border-top: 1px solid var(--border-color); display: flex; background: white; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #888; cursor: pointer; font-size: 11px; transition: color 0.2s; }
        .nav-item.active { color: var(--main-color); }
        .nav-item i { font-size: 20px; margin-bottom: 4px; }

        /* アイテム一覧 */
        .list-item { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid #f2f2f7; cursor: pointer; transition: background 0.2s; }
        .list-item:hover { background: #f2f2f7; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #ccc; margin-right: 14px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 16px; flex-shrink: 0; }
        
        /* チャット画面 */
        #chat-page { display: none; flex-direction: column; height: 100%; width: 100%; background: #eceff1; position: relative; }
        .chat-header { background: white; padding: 15px; display: flex; align-items: center; border-bottom: 1px solid var(--border-color); height: 60px; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        
        /* チャットバルーン */
        .msg { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 14px; word-break: break-all; line-height: 1.4; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .msg.recv { background: white; align-self: flex-start; border-top-left-radius: 4px; color: #000; }
        .msg.send { background: var(--main-color); color: white; align-self: flex-end; border-top-right-radius: 4px; }
        .msg img { max-width: 100%; border-radius: 10px; margin-top: 6px; display: block; max-height: 240px; object-fit: cover; }
        .msg a { color: #ffeb3b; text-decoration: underline; }
        .msg.recv a { color: var(--main-color); }
        
        /* 入力エリア */
        .chat-input-area { background: white; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--border-color); }
        .chat-input-area input { flex: 1; padding: 10px 16px; border: 1px solid #e5e5ea; border-radius: 20px; outline: none; font-size: 14px; background: #f2f2f7; transition: background 0.2s; }
        .chat-input-area input:focus { background: #fff; border-color: var(--main-color); }
        .icon-btn { font-size: 22px; color: #666; cursor: pointer; padding: 4px; transition: color 0.2s; }
        .icon-btn:hover { color: var(--main-color); }

        /* プレースホルダー */
        .chat-placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; background: #f5f5f7; font-size: 14px; }
        .chat-placeholder i { font-size: 48px; margin-bottom: 12px; color: #ddd; }

        /* 設定画面 */
        .settings-section { padding: 16px; border-bottom: 1px solid var(--border-color); background: white; }
        .settings-section h4 { margin-bottom: 12px; color: #666; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        .setting-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; font-size: 14px; border-bottom: 1px dashed #eee; }
        .setting-row:last-child { border-bottom: none; }
        .setting-row span { font-weight: bold; color: #444; }
        select, input[type="text"], input[type="file"] { padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d1d6; width: 100%; font-size: 13px; outline: none; }

        /* オーバーレイ */
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); }
        .dialog { background: white; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.15); }
        .dialog h3 { margin-bottom: 12px; font-size: 18px; }
        .dialog-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 14px; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        .btn-primary { background: var(--main-color); color: white; }
        .btn-danger { background: #ff3b30; color: white; }
        .btn-secondary { background: #e5e5ea; color: #333; }

        /* 通話画面 */
        #call-overlay { background: #1c1c1e; color: white; flex-direction: column; justify-content: space-between; padding: 40px 20px; z-index: 200; }
        .video-container { width: 100%; max-width: 600px; height: 60%; background: #000; position: relative; border-radius: 16px; overflow: hidden; margin: 0 auto; }
        video { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { width: 120px; height: 160px; position: absolute; top: 10px; right: 10px; border: 2px solid white; border-radius: 10px; z-index: 10; }
        
        .back-btn { display: none; margin-right: 12px; }

        /* ================= スマートフォン・タブレット最適化（レスポンシブ） ================= */
        @media (max-width: 820px) {
            #app-container { flex-direction: column; }
            .sidebar { width: 100%; min-width: 100%; position: absolute; left: 0; top: 0; }
            .sidebar.inactive { transform: translateX(-100%); }
            .main-content { width: 100%; height: 100%; position: absolute; left: 0; top: 0; display: none; }
            .main-content.active { display: flex; }
            .back-btn { display: inline-block; }
            .chat-placeholder { display: none; }
        }
    </style>
</head>
<body>

<div id="app-container">
    
    <div class="sidebar" id="appSidebar">
        <div class="header">
            <div class="logo">SkyDot</div>
            <div class="my-id-display" id="myIdText" onclick="copyMyId()">マイID: 発行中...</div>
        </div>

        <div class="sidebar-content">
            <div id="friends-page" class="page active">
                <div style="padding: 15px; display: flex; gap: 8px;">
                    <input type="text" id="addFriendId" placeholder="フレンドのIDを入力">
                    <button class="btn btn-primary" onclick="addFriend()" style="padding:0 15px; flex-shrink:0;">追加</button>
                </div>
                <div id="friends-list"></div>
            </div>

            <div id="rooms-page" class="page">
                <div id="rooms-list"></div>
            </div>

            <div id="settings-page" class="page">
                <div class="settings-section">
                    <h4>🔔 カスタム通信音・通知音設定</h4>
                    <div class="setting-row">
                        <span>📞 発信通信音 (ファイル選択)</span>
                        <input type="file" id="customCallSoundFile" accept="audio/*">
                    </div>
                    <div class="setting-row">
                        <span>💬 メッセージ通知音 (ファイル選択)</span>
                        <input type="file" id="customMsgSoundFile" accept="audio/*">
                    </div>
                </div>
                <div class="settings-section">
                    <h4>🔒 権限設定</h4>
                    <div class="setting-row">
                        <span>カメラ・マイクの許可</span>
                        <button class="btn btn-secondary" onclick="requestMediaPermission()" style="padding:6px 12px; font-size:12px;">許可を要求</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h4>📲 バックアップ</h4>
                    <button class="btn btn-secondary" onclick="exportData()" style="width:100%;">データ転送（書き出し）</button>
                </div>
            </div>
        </div>

        <div class="nav-bar" id="bottomNav">
            <div class="nav-item active" onclick="switchTab('friends')"><i class="fa-solid fa-user"></i>フレンド</div>
            <div class="nav-item" onclick="switchTab('rooms')"><i class="fa-solid fa-comment"></i>メッセージ</div>
            <div class="nav-item" onclick="switchTab('settings')"><i class="fa-solid fa-gear"></i>設定</div>
        </div>
    </div>

    <div class="main-content" id="mainContentArea">
        
        <div class="chat-placeholder" id="chatPlaceholder">
            <i class="fa-solid fa-comments"></i>
            <p>フレンドまたはメッセージを選択してトークを開始</p>
        </div>

        <div id="chat-page">
            <div class="chat-header">
                <i class="fa-solid fa-arrow-left icon-btn back-btn" onclick="closeChatMobile()"></i>
                <b id="chat-title" style="flex: 1; font-size:16px;">トーク</b>
                <i class="fa-solid fa-phone icon-btn" style="color:var(--main-color); margin-right:5px;" onclick="openCallChoiceModal()"></i>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <label class="fa-solid fa-image icon-btn">
                    <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="sendImage(this)">
                </label>
                <input type="text" id="chatInput" placeholder="メッセージを入力...">
                <i class="fa-solid fa-paper-plane icon-btn" style="color:var(--main-color);" onclick="sendTextMessage()"></i>
            </div>
        </div>

    </div>

    <div id="call-choice-modal" class="overlay">
        <div class="dialog">
            <h3>通話方法を選択</h3>
            <p style="color:#666; margin-bottom:20px; font-size:14px;">どちらの方法で発信しますか？</p>
            <button class="btn btn-primary" onclick="startCallFlow('audio')" style="margin-bottom:10px; width:100%;"><i class="fa-solid fa-phone"></i> 音声通話</button>
            <button class="btn btn-primary" onclick="startCallFlow('video')" style="width:100%;"><i class="fa-solid fa-video"></i> 画面通話</button>
            <button class="btn btn-secondary" onclick="closeOverlay('call-choice-modal')" style="margin-top:15px; width:100%;">キャンセル</button>
        </div>
    </div>

    <div id="calling-overlay" class="overlay">
        <div class="dialog">
            <h2 id="calling-status">呼び出し中...</h2>
            <p id="calling-name" style="margin: 15px 0; font-weight:bold; font-size:18px;"></p>
            <i class="fa-solid fa-phone-volume fa-spin" style="font-size:40px; color:var(--main-color); margin:20px 0;"></i>
            <button class="btn btn-danger" onclick="cancelCall()" style="width:100%;">切断</button>
        </div>
    </div>

    <div id="incoming-overlay" class="overlay">
        <div class="dialog">
            <h3>着信があります</h3>
            <p id="incoming-name" style="margin:15px 0; font-weight:bold; font-size:18px; color:var(--main-color);"></p>
            <p style="margin-bottom:15px; font-size:14px;">通話を開始しますか？</p>
            <div class="dialog-btns">
                <button class="btn btn-danger" onclick="answerCall(false)">出ない</button>
                <button class="btn btn-primary" onclick="answerCall(true)">出る</button>
            </div>
        </div>
    </div>

    <div id="result-overlay" class="overlay">
        <div class="dialog">
            <h3 id="result-status">通話が終了しました</h3>
            <p id="result-duration" style="margin:15px 0; font-size:15px; color:#555;"></p>
            <button class="btn btn-primary" onclick="closeOverlay('result-overlay')" style="width:100%;">確認</button>
        </div>
    </div>

    <div id="call-overlay" class="overlay">
        <div id="call-timer" style="font-size:24px; font-weight:bold; text-align:center; letter-spacing:1px; margin-bottom:10px;">00:00</div>
        <div class="video-container" id="videoArea" style="display:none;">
            <video id="localVideo" autoplay muted playsinline></video>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
        <div id="audioCallProfile" style="text-align:center; margin:auto 0;">
            <div class="avatar" style="width:90px; height:90px; font-size:36px; margin:0 auto 15px; background:var(--main-color);">📞</div>
            <h3 id="audioCallName" style="font-size:22px;">ユーザー</h3>
            <p style="color:#aaa; margin-top:5px; font-size:14px;">音声通話中</p>
        </div>
        <button class="btn btn-danger" style="border-radius:50%; width:75px; height:75px; margin:30px auto 0; display:flex; align-items:center; justify-content:center; flex-shrink:0;" onclick="endActiveCall()">
            <i class="fa-solid fa-phone-slash" style="font-size:26px;"></i>
        </button>
    </div>

</div>

<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<script>
    // --- データ保持構造 ---
    let friends = JSON.parse(localStorage.getItem('sd_full_friends') || '[]');
    let chatHistory = JSON.parse(localStorage.getItem('sd_full_chats') || '{}');
    let currentChatTarget = null;

    // --- WebRTC / オーディオ関連 ---
    let peer = new Peer();
    let myId = "";
    let activeDataConn = null; 
    let activeMediaCall = null;
    let localStream = null;
    
    let callStartTime = null;
    let callTimerInterval = null;
    let audioCallAudioElement = null;
    
    // カスタムサウンドバッファ格納用
    let customCallSoundUrl = null;
    let customMsgSoundUrl = null;
    let currentAudioSource = null;

    // --- システム初期化 ---
    peer.on('open', (id) => {
        myId = id;
        document.getElementById('myIdText').innerText = `マイID: ${id} (タップでコピー)`;
        renderFriends();
        renderRooms();
    });

    function copyMyId() {
        if(!myId) return;
        navigator.clipboard.writeText(myId);
        alert("マイIDをクリップボードにコピーしました！");
    }

    // カスタム音源ファイルの読み込みリスナー
    document.getElementById('customCallSoundFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(file) customCallSoundUrl = URL.createObjectURL(file);
    });
    document.getElementById('customMsgSoundFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if(file) customMsgSoundUrl = URL.createObjectURL(file);
    });

    // ナビゲーション切り替え
    function switchTab(pageId) {
        document.querySelectorAll('.sidebar .page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`${pageId}-page`).classList.add('active');
        
        const navIdx = { friends: 0, rooms: 1, settings: 2 }[pageId];
        if(navIdx !== undefined) document.getElementById('bottomNav').children[navIdx].classList.add('active');
    }

    // 相手をフレンドに自動/手動追加する関数
    function autoAddFriendIfNeeded(targetId, defaultName = "新しいフレンド") {
        if (!friends.some(f => f.id === targetId)) {
            friends.push({ id: targetId, name: defaultName });
            localStorage.setItem('sd_full_friends', JSON.stringify(friends));
            renderFriends();
            renderRooms();
        }
    }

    function addFriend() {
        const idInput = document.getElementById('addFriendId');
        const fid = idInput.value.trim();
        if(!fid) return;
        if(fid === myId) return alert("自分のIDは登録できません");
        if(friends.some(f => f.id === fid)) return alert("既に登録されています");

        const name = prompt("表示名を入力してください:");
        if(!name) return;

        friends.push({ id: fid, name: name });
        localStorage.setItem('sd_full_friends', JSON.stringify(friends));
        idInput.value = "";
        renderFriends();
        renderRooms();
    }

    function renderFriends() {
        const list = document.getElementById('friends-list');
        list.innerHTML = friends.length === 0 ? '<p style="padding:25px; color:#999; text-align:center; font-size:14px;">フレンドがいません</p>' : '';
        friends.forEach(f => {
            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `<div class="avatar">${f.name[0]}</div><div><b>${f.name}</b><div style="font-size:11px; color:#aaa; margin-top:2px;">ID: ${f.id}</div></div>`;
            item.onclick = () => openChatRoom(f.id);
            list.appendChild(item);
        });
    }

    function renderRooms() {
        const list = document.getElementById('rooms-list');
        list.innerHTML = '';
        const activeRoomIds = Object.keys(chatHistory);
        
        if(activeRoomIds.length === 0) {
            list.innerHTML = '<p style="padding:25px; color:#999; text-align:center; font-size:14px;">トーク履歴はありません</p>';
        }
        
        activeRoomIds.forEach(id => {
            const friend = friends.find(f => f.id === id) || { id: id, name: "新しいフレンド" };
            const history = chatHistory[id];
            if(history.length === 0) return;
            const lastMsg = history[history.length - 1];
            let text = lastMsg.type === 'text' ? lastMsg.content : '📷 [写真]';
            
            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `<div class="avatar">${friend.name[0]}</div><div style="flex:1; overflow:hidden;"><b style="display:block; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${friend.name}</b><div style="font-size:12px; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;">${text}</div></div>`;
            item.onclick = () => openChatRoom(id);
            list.appendChild(item);
        });
    }

    function openChatRoom(friendId) {
        currentChatTarget = friendId;
        autoAddFriendIfNeeded(friendId, "トーク相手");
        const friend = friends.find(f => f.id === friendId);
        
        document.getElementById('chat-title').innerText = friend.name;
        document.getElementById('chatPlaceholder').style.display = 'none';
        document.getElementById('chat-page').style.display = 'flex';
        
        document.getElementById('mainContentArea').classList.add('active');
        document.getElementById('appSidebar').classList.add('inactive');
        
        renderMessages();
        
        if (!activeDataConn || activeDataConn.peer !== friendId) {
            activeDataConn = peer.connect(friendId);
            setupDataConnection(activeDataConn);
        }
    }

    function closeChatMobile() {
        document.getElementById('mainContentArea').classList.remove('active');
        document.getElementById('appSidebar').classList.remove('inactive');
    }

    function renderMessages() {
        const box = document.getElementById('chatMessages');
        box.innerHTML = '';
        const history = chatHistory[currentChatTarget] || [];
        
        history.forEach(m => {
            const div = document.createElement('div');
            div.className = `msg ${m.sender === 'me' ? 'send' : 'recv'}`;
            if(m.type === 'text') {
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                div.innerHTML = m.content.replace(urlRegex, (url) => `<a href="${url}" target="_blank">${url}</a>`);
            } else if (m.type === 'image') {
                div.innerHTML = `<div>📷 写真</div><img src="${m.content}">`;
            }
            box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
    }

    function sendTextMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if(!text || !currentChatTarget) return;

        saveMessage(currentChatTarget, 'me', 'text', text);
        renderMessages();
        input.value = '';

        if(activeDataConn && activeDataConn.open) {
            activeDataConn.send({ action: 'msg', type: 'text', content: text, myName: "フレンド" });
        }
    }

    function sendImage(input) {
        const file = input.files[0];
        if(!file || !currentChatTarget) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const base64 = e.target.result;
            saveMessage(currentChatTarget, 'me', 'image', base64);
            renderMessages();
            if(activeDataConn && activeDataConn.open) {
                activeDataConn.send({ action: 'msg', type: 'image', content: base64, myName: "フレンド" });
            }
        };
        reader.readAsDataURL(file);
    }

    function saveMessage(targetId, sender, type, content) {
        if(!chatHistory[targetId]) chatHistory[targetId] = [];
        chatHistory[targetId].push({ sender, type, content });
        localStorage.setItem('sd_full_chats', JSON.stringify(chatHistory));
        renderRooms();
    }

    // --- P2Pリンク受信イベント群 ---
    peer.on('connection', (conn) => {
        activeDataConn = conn;
        setupDataConnection(conn);
    });

    function setupDataConnection(conn) {
        conn.on('data', (data) => {
            // 受信相手をフレンドリストへ自動追加
            autoAddFriendIfNeeded(conn.peer, data.myName || "新しいフレンド");

            if(data.action === 'msg') {
                saveMessage(conn.peer, 'other', data.type, data.content);
                playNotificationSound();
                if(currentChatTarget === conn.peer) renderMessages();
            }
            if(data.action === 'call_rejected') {
                handleCallEndProcedure();
            }
        });
    }

    // --- メディア通話ロジック ---
    function openCallChoiceModal() {
        document.getElementById('call-choice-modal').style.display = 'flex';
    }

    function closeOverlay(id) {
        document.getElementById(id).style.display = 'none';
    }

    async function startCallFlow(type) {
        closeOverlay('call-choice-modal');
        autoAddFriendIfNeeded(currentChatTarget, "トーク相手");
        const friend = friends.find(f => f.id === currentChatTarget);
        
        document.getElementById('calling-name').innerText = friend.name;
        document.getElementById('calling-overlay').style.display = 'flex';
        
        startRinging();

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: (type === 'video') });
            const call = peer.call(currentChatTarget, localStream, { metadata: { type: type, myName: "フレンド" } });
            activeMediaCall = call;
            setupMediaCall(call);
        } catch (err) {
            alert("カメラ・マイクの取得に失敗しました。");
            cancelCall();
        }
    }

    function cancelCall() {
        stopRinging();
        if(activeMediaCall) activeMediaCall.close();
        if(activeDataConn && activeDataConn.open) activeDataConn.send({ action: 'call_rejected' });
        closeOverlay('calling-overlay');
        if(localStream) localStream.getTracks().forEach(t => t.stop());
    }

    peer.on('call', (call) => {
        activeMediaCall = call;
        autoAddFriendIfNeeded(call.peer, call.metadata.myName || "新しいフレンド");
        const friend = friends.find(f => f.id === call.peer);
        const cType = call.metadata.type === 'video' ? '画面通話' : '音声通話';

        document.getElementById('incoming-name').innerText = `${friend.name} (${cType})`;
        document.getElementById('incoming-overlay').style.display = 'flex';
        startRinging();
    });

    async function answerCall(accept) {
        stopRinging();
        closeOverlay('incoming-overlay');
        if(!activeMediaCall) return;

        if(accept) {
            try {
                const isVideo = activeMediaCall.metadata.type === 'video';
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
                activeMediaCall.answer(localStream);
                setupMediaCall(activeMediaCall);
            } catch(e) {
                alert("ハードウェアの許可エラー。");
                activeMediaCall.close();
            }
        } else {
            if(activeDataConn && activeDataConn.open) activeDataConn.send({ action: 'call_rejected' });
            activeMediaCall.close();
            handleCallEndProcedure();
        }
    }

    function setupMediaCall(call) {
        call.on('stream', (remoteStream) => {
            stopRinging();
            closeOverlay('calling-overlay');
            
            document.getElementById('call-overlay').style.display = 'flex';
            const isVideo = call.metadata.type === 'video';
            const fInfo = friends.find(f => f.id === call.peer) || { name: "通話相手" };

            if(isVideo) {
                document.getElementById('videoArea').style.display = 'block';
                document.getElementById('audioCallProfile').style.display = 'none';
                document.getElementById('localVideo').srcObject = localStream;
                document.getElementById('remoteVideo').srcObject = remoteStream;
            } else {
                document.getElementById('videoArea').style.display = 'none';
                document.getElementById('audioCallProfile').style.display = 'block';
                document.getElementById('audioCallName').innerText = fInfo.name;
                
                if(!audioCallAudioElement){
                    audioCallAudioElement = document.createElement('audio');
                    document.body.appendChild(audioCallAudioElement);
                }
                audioCallAudioElement.srcObject = remoteStream;
                audioCallAudioElement.autoplay = true;
            }

            // タイマーリセットと開始
            callStartTime = Date.now();
            clearInterval(callTimerInterval);
            callTimerInterval = setInterval(updateCallTimer, 1000);
        });

        // 相手が通話を切断した時のイベントリスナー
        call.on('close', () => {
            handleCallEndProcedure();
        });
    }

    function endActiveCall() {
        if(activeMediaCall) activeMediaCall.close();
        if(activeDataConn && activeDataConn.open) activeDataConn.send({ action: 'call_rejected' });
        handleCallEndProcedure();
    }

    function handleCallEndProcedure() {
        stopRinging();
        clearInterval(callTimerInterval);
        
        closeOverlay('calling-overlay');
        closeOverlay('incoming-overlay');
        document.getElementById('call-overlay').style.display = 'none';
        
        let durationSec = 0;
        if(callStartTime) {
            durationSec = Math.floor((Date.now() - callStartTime) / 1000);
        }
        
        if(localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if(audioCallAudioElement) {
            audioCallAudioElement.srcObject = null;
        }

        showCallResult("通話が終了しました", durationSec);
        callStartTime = null;
    }

    function updateCallTimer() {
        if(!callStartTime) return;
        const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
        const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const secs = String(elapsed % 60).padStart(2, '0');
        document.getElementById('call-timer').innerText = `${mins}:${secs}`;
    }

    function showCallResult(statusText, totalSeconds) {
        document.getElementById('result-status').innerText = statusText;
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        document.getElementById('result-duration').innerText = `通話時間: ${mins}分 ${secs}秒`;
        document.getElementById('result-overlay').style.display = 'flex';
    }

    // --- サウンドコントロール ---
    function startRinging() {
        stopRinging();
        currentAudioSource = new Audio();
        if (customCallSoundUrl) {
            currentAudioSource.src = customCallSoundUrl;
            currentAudioSource.loop = true;
            currentAudioSource.play().catch(()=>{});
        } else {
            // 標準ビープ音のフォールバック
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.value = 440; gain.gain.value = 0.1;
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start();
            currentAudioSource = { stop: () => { osc.stop(); } };
        }
    }

    function stopRinging() {
        if(currentAudioSource) {
            try { currentAudioSource.pause(); } catch(e){}
            try { currentAudioSource.stop(); } catch(e){}
            currentAudioSource = null;
        }
    }

    function playNotificationSound() {
        let msgAudio = new Audio();
        if (customMsgSoundUrl) {
            msgAudio.src = customMsgSoundUrl;
            msgAudio.play().catch(()=>{});
        } else {
            let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.frequency.value = 880; gain.gain.value = 0.05;
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    function requestMediaPermission() {
        navigator.mediaDevices.getUserMedia({ audio: true, video: true })
            .then(() => alert("カメラ・マイクのアクセスが正常に許可されました！"))
            .catch(() => alert("許可が拒否されました。"));
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({friends, chatHistory}));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href",     dataStr);
        downloadAnchor.setAttribute("download", "skydot_backup.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }
</script>
